name: Validate ATHR preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-static-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML, required controls, and no video capture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("index.html").read_text(encoding="utf-8")
          required = ["chatWorkspace", "attachImageBtn", "speechInputBtn", "voiceReplyBtn", "recordNoteBtn", "tutorLanguage", "tutorLevel", "tutorMode"]
          missing = [item for item in required if f'id="{item}"' not in source]
          if missing:
              raise SystemExit("Missing required UI controls: " + ", ".join(missing))
          forbidden = [r"<video\b", r"capture\s*=\s*['\"]user", r"accept=['\"][^'\"]*video/"]
          found = [pattern for pattern in forbidden if re.search(pattern, source, re.I)]
          if found:
              raise SystemExit("Camera/video UI is not allowed in ATHR.")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", source, re.I)
          if not scripts:
              raise SystemExit("No inline application scripts found.")
          Path("/tmp/athr-inline-scripts").mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              Path(f"/tmp/athr-inline-scripts/{index}.mjs").write_text(script, encoding="utf-8")
          print(f"Found {len(scripts)} inline script blocks; required controls and media restrictions passed.")
          PY
      - name: Check media preview lifecycle and safe inference error paths
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("index.html").read_text(encoding="utf-8")
          api = Path("supabase/functions/athr-chat/index.ts").read_text(encoding="utf-8")
          checks = {
              "image type validation": 'file.type.startsWith("image/")' in page,
              "image size limit": 'file.size>10*1024*1024' in page,
              "preview URL cleanup": "URL.revokeObjectURL(athrPreviewObjectUrl)" in page,
              "recording uses captured recorder": "const recorder=new MediaRecorder(stream)" in page and "type:recorder.mimeType" in page,
              "stream cleanup": "stream.getTracks().forEach(t=>t.stop())" in page,
              "nullable conversation on inference failure": 'conversation_id: conversation?.id || null' in api,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Media/error-path checks failed: " + ", ".join(failed))
          print("Media preview lifecycle and inference error-path checks passed.")
          PY
      - name: Check request payload validation
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("supabase/functions/athr-chat/index.ts").read_text(encoding="utf-8")
          checks = {
              "JSON content type required": 'error: "content_type_invalid"' in api,
              "declared body size capped": 'declaredLength > 65536' in api,
              "actual body bytes capped": 'byteLength > 65536' in api,
              "JSON parse errors handled": 'error: "invalid_json"' in api,
              "non-object JSON rejected": 'Array.isArray(body)' in api and 'error: "request_body_invalid"' in api,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Request validation checks failed: " + ", ".join(failed))
          print("Request payload validation checks passed.")
          PY
      - name: Check atomic chat persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          api = Path("supabase/functions/athr-chat/index.ts").read_text(encoding="utf-8")
          checks = {
              "single batched message insert": 'db.from("messages").insert([' in api,
              "both user and assistant entries in same batch": 'role: "user", content: message' in api and 'role: "assistant", content: answer' in api,
              "new conversation cleanup on persistence failure": 'if (isNewConversation)' in api and 'db.from("conversations").delete()' in api,
              "partial message writes removed": 'userSaveError' not in api and 'assistantSaveError' not in api,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Atomic persistence checks failed: " + ", ".join(failed))
          print("Atomic chat persistence checks passed.")
          PY
      - name: Check JavaScript syntax
        run: |
          for file in /tmp/athr-inline-scripts/*.mjs; do
            node --check "$file"
          done
